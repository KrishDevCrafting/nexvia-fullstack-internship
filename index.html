<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 1. SEMANTIC & ACCESSIBLE HTML5 FORM -->
<section class="checkout-card">
  <h2>Customer Registration & Order</h2>
  <form id="orderForm" novalidate>
    <div class="form-row">
      <label for="fullName">Full Name</label>
      <input type="text" id="fullName" name="fullName" required placeholder="Alex Morgan" />
    </div>

    <div class="form-row">
      <label for="email">Work Email</label>
      <input type="email" id="email" name="email" required placeholder="alex@example.com" />
    </div>

    <div class="form-row">
      <label for="product">Select Product</label>
      <select id="product" name="product" required>
        <option value="">-- Choose an item --</option>
        <option value="keyboard">Mechanical Keyboard ($89.99)</option>
        <option value="monitor">4K Gaming Monitor ($450.00)</option>
      </select>
    </div>

    <button type="submit" class="btn-submit">Complete Order</button>
  </form>
</section>

<!-- 2. MODERN RESPONSIVE CSS -->
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  .checkout-card {
    max-width: 540px;
    margin: 2rem auto;
    padding: 2rem;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    font-family: system-ui, sans-serif;
  }
  .form-row {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    margin-bottom: 1.25rem;
  }
  label {
    font-size: 0.875rem;
    font-weight: 600;
    color: #1e293b;
  }
  input, select {
    width: 100%;
    padding: 0.75rem 1rem;
    border: 1.5px solid #cbd5e1;
    border-radius: 8px;
    font-size: 0.95rem;
    transition: border-color 0.2s;
  }
  input:focus, select:focus {
    outline: none;
    border-color: #3b82f6;
  }
  .btn-submit {
    width: 100%;
    padding: 0.875rem;
    background: #2563eb;
    color: white;
    font-weight: 700;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  .btn-submit:hover {
    background: #1d4ed8;
  }
</style>
</body>
</html>
